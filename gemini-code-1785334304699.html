<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปฏิทินบันทึกประจำเดือน</title>
    <style>
        :root {
            --primary-color: #ff6b81;
            --bg-color: #fce4ec;
            --text-color: #333;
            --white: #fff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--white);
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header button {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .header button:hover {
            background-color: #ff4757;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            color: #747d8c;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f1f2f6;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            font-size: 14px;
            transition: all 0.2s;
        }

        .day:hover {
            background-color: #dfe4ea;
        }

        .day.period {
            background-color: var(--primary-color);
            color: var(--white);
        }

        .day .has-note {
            width: 6px;
            height: 6px;
            background-color: #2ed573;
            border-radius: 50%;
            position: absolute;
            bottom: 5px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--white);
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 350px;
        }

        .modal h3 {
            margin-top: 0;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
            box-sizing: border-box;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-buttons button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-save { background-color: var(--primary-color); color: var(--white); }
        .btn-cancel { background-color: #ccc; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <button id="prevBtn">&lt;</button>
            <h2 id="monthYear"></h2>
            <button id="nextBtn">&gt;</button>
        </div>
        
        <div class="weekdays">
            <div>อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div>ส</div>
        </div>
        
        <div class="days" id="calendarDays"></div>
    </div>

    <!-- Modal สำหรับเพิ่มโน้ต -->
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <h3 id="modalDateTitle">วันที่</h3>
            
            <div class="form-group">
                <label>
                    <input type="checkbox" id="isPeriod"> วันนี้มีประจำเดือน 🩸
                </label>
            </div>
            
            <div class="form-group">
                <label for="noteText">บันทึกอาการหรือโน้ตเพิ่มเติม:</label>
                <textarea id="noteText" rows="4" placeholder="เช่น ปวดท้อง, อารมณ์แปรปรวน..."></textarea>
            </div>
            
            <div class="modal-buttons">
                <button class="btn-cancel" id="cancelBtn">ยกเลิก</button>
                <button class="btn-save" id="saveBtn">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        // โหลดข้อมูลจาก LocalStorage
        let trackerData = JSON.parse(localStorage.getItem('periodTrackerData')) || {};
        
        const calendarDays = document.getElementById('calendarDays');
        const monthYear = document.getElementById('monthYear');
        const noteModal = document.getElementById('noteModal');
        const modalDateTitle = document.getElementById('modalDateTitle');
        const isPeriodCheckbox = document.getElementById('isPeriod');
        const noteText = document.getElementById('noteText');
        
        let currentDate = new Date();
        let selectedDateStr = "";

        const thaiMonths = [
            "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
            "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
        ];

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            monthYear.textContent = `${thaiMonths[month]} ${year + 543}`;
            calendarDays.innerHTML = '';

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // ช่องว่างสำหรับวันก่อนหน้า
            for (let i = 0; i < firstDay; i++) {
                const emptyDiv = document.createElement('div');
                calendarDays.appendChild(emptyDiv);
            }

            // สร้างวันในปฏิทิน
            for (let i = 1; i <= daysInMonth; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.classList.add('day');
                dayDiv.textContent = i;

                // สร้าง key วันที่รูปแบบ YYYY-MM-DD
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                // ตรวจสอบข้อมูลที่มี
                if (trackerData[dateKey]) {
                    if (trackerData[dateKey].isPeriod) {
                        dayDiv.classList.add('period');
                    }
                    if (trackerData[dateKey].note && trackerData[dateKey].note.trim() !== "") {
                        const noteDot = document.createElement('div');
                        noteDot.classList.add('has-note');
                        dayDiv.appendChild(noteDot);
                    }
                }

                // เมื่อคลิกที่วัน ให้เปิด Modal
                dayDiv.addEventListener('click', () => openModal(dateKey, i, month, year));
                
                calendarDays.appendChild(dayDiv);
            }
        }

        function openModal(dateKey, day, month, year) {
            selectedDateStr = dateKey;
            modalDateTitle.textContent = `บันทึกวันที่ ${day} ${thaiMonths[month]} ${year + 543}`;
            
            // โหลดข้อมูลเก่ามาแสดง (ถ้ามี)
            if (trackerData[dateKey]) {
                isPeriodCheckbox.checked = trackerData[dateKey].isPeriod;
                noteText.value = trackerData[dateKey].note;
            } else {
                isPeriodCheckbox.checked = false;
                noteText.value = "";
            }
            
            noteModal.style.display = 'flex';
        }

        function closeModal() {
            noteModal.style.display = 'none';
        }

        function saveData() {
            trackerData[selectedDateStr] = {
                isPeriod: isPeriodCheckbox.checked,
                note: noteText.value
            };
            
            // ถ้าไม่มีทั้งประจำเดือนและไม่มีโน้ต ให้ลบข้อมูลออกเพื่อประหยัดพื้นที่
            if (!trackerData[selectedDateStr].isPeriod && trackerData[selectedDateStr].note.trim() === "") {
                delete trackerData[selectedDateStr];
            }
            
            // บันทึกลง LocalStorage
            localStorage.setItem('periodTrackerData', JSON.stringify(trackerData));
            
            closeModal();
            renderCalendar();
        }

        // Event Listeners ปุ่มเลื่อนเดือน
        document.getElementById('prevBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        // Event Listeners สำหรับ Modal
        document.getElementById('cancelBtn').addEventListener('click', closeModal);
        document.getElementById('saveBtn').addEventListener('click', saveData);
        
        // ปิด Modal เมื่อคลิกพื้นที่ว่างข้างนอก
        window.addEventListener('click', (e) => {
            if (e.target === noteModal) closeModal();
        });

        // เริ่มต้นวาดปฏิทินเมื่อเปิดหน้าเว็บ
        renderCalendar();
    </script>
</body>
</html>
