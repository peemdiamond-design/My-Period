<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปฏิทินบันทึกประจำเดือน - Mint & Choc Retro</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --mint-main: #a8e6cf;
            --mint-box: #e0f6f7;
            --choc-dark: #4b2e2b;
            --choc-bar: #5c3a21;
            --choc-border: #38220f;
            --accent-pink: #ff6b81;
            --accent-brown-heart: #a0522d;
            --white: #fffcf9;
        }

        body {
            font-family: 'VT323', monospace;
            /* สร้างพื้นหลังแบ่งครึ่งตามเรฟ: ครึ่งบนลาย Polka Dot มินต์จุดขาว+ดาวช็อก, ครึ่งล่างลายช็อกโกแลตบาร์ */
            background-color: var(--mint-main);
            background-image: 
                /* ครึ่งล่าง: ลายตารางบล็อกช็อกโกแลตบาร์ */
                linear-gradient(rgba(75, 46, 43, 0.85) 50%, rgba(56, 34, 15, 0.95) 50%),
                /* ครึ่งบน: ลายจุด Polka dot ขาว บนพื้นมินต์ */
                radial-gradient(#ffffff 20%, transparent 21%),
                radial-gradient(#ffffff 20%, transparent 21%);
            background-size: 100% 300px, 40px 40px, 40px 40px;
            background-position: bottom, 0 0, 20px 20px;
            background-repeat: repeat-x, repeat, repeat;
            color: var(--choc-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-size: 20px;
        }

        .container {
            background-color: var(--white);
            border: 4px solid var(--choc-border);
            box-shadow: 6px 6px 0px var(--choc-dark);
            width: 100%;
            max-width: 440px;
            padding: 25px 20px 20px 20px;
            position: relative;
            margin-top: 20px;
        }

        /* ตกแต่งรูปโบว์จำลองที่มุมบนขวาของกล่อง */
        .bow-decoration {
            position: absolute;
            top: -25px;
            right: -15px;
            font-size: 36px;
            filter: drop-shadow(2px 2px 0px var(--choc-dark));
            z-index: 10;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--choc-bar);
            border: 3px solid var(--choc-border);
            padding: 10px;
            color: var(--white);
            margin-bottom: 15px;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.3);
        }

        .header h2 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
        }

        .header button {
            background-color: var(--mint-main);
            color: var(--choc-dark);
            border: 2px solid var(--choc-border);
            padding: 4px 12px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 2px 2px 0px var(--choc-border);
        }

        .header button:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .mode-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--mint-box);
            border: 2px dashed var(--mint-main);
            padding: 8px 12px;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .mode-selector label {
            cursor: pointer;
            font-weight: bold;
            color: var(--choc-dark);
        }

        .mode-selector input[type="checkbox"] {
            accent-color: var(--choc-bar);
            transform: scale(1.3);
            cursor: pointer;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--choc-bar);
            font-size: 22px;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background-color: var(--white);
            cursor: pointer;
            padding: 4px 2px;
            font-size: 18px;
            box-sizing: border-box;
            /* ค่าเริ่มต้น: วันที่ยังไม่เป็นเมนส์ กรอบสีน้ำตาลช็อกโกแลต */
            border: 2px solid var(--choc-bar);
            box-shadow: 2px 2px 0px rgba(75, 46, 43, 0.3);
        }

        .day:hover {
            background-color: var(--mint-box);
        }

        /* เมื่อเป็นเมนส์: เปลี่ยนกรอบเป็นสีเขียวมินต์ */
        .day.period {
            background-color: #f2fcf7;
            border: 2px solid #2ed573;
            box-shadow: 2px 2px 0px rgba(46, 213, 115, 0.4);
        }

        .day-number {
            font-weight: bold;
            color: var(--choc-dark);
        }

        .day-emojis {
            display: flex;
            gap: 1px;
            font-size: 14px;
            min-height: 16px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(75, 46, 43, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--white);
            border: 4px solid var(--choc-bar);
            box-shadow: 6px 6px 0px var(--choc-dark);
            padding: 20px;
            width: 90%;
            max-width: 320px;
        }

        .modal h3 {
            margin-top: 0;
            color: var(--choc-dark);
            border-bottom: 2px dashed var(--choc-bar);
            padding-bottom: 6px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            cursor: pointer;
            color: var(--choc-dark);
            font-size: 18px;
        }

        .form-group input[type="checkbox"] {
            accent-color: var(--choc-bar);
            transform: scale(1.2);
        }

        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 2px solid var(--choc-bar);
            background-color: var(--mint-box);
            resize: none;
            box-sizing: border-box;
            color: var(--choc-dark);
            font-family: 'VT323', monospace;
            font-size: 18px;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: var(--choc-dark);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-buttons button {
            padding: 6px 14px;
            border: 2px solid var(--choc-border);
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 2px 2px 0px var(--choc-border);
        }

        .btn-save { 
            background-color: var(--mint-main); 
            color: var(--choc-dark); 
        }
        .btn-save:active { transform: translate(2px, 2px); box-shadow: none; }
        
        .btn-cancel { 
            background-color: #dcdde1; 
            color: #57606f; 
        }
        .btn-cancel:active { transform: translate(2px, 2px); box-shadow: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- รูปโบว์ประดับมุมกล่อง -->
        <div class="bow-decoration">🎀</div>

        <div class="header">
            <button id="prevBtn">&lt;</button>
            <h2 id="monthYear"></h2>
            <button id="nextBtn">&gt;</button>
        </div>
        
        <div class="mode-selector">
            <label>
                <input type="checkbox" id="multiSelectMode"> โหมดเลือกหลายวัน (🩸)
            </label>
            <span id="actionHint" style="font-size: 16px; color: var(--accent-pink); font-weight: bold; display: none;">เลือกวันสิ้นสุด</span>
        </div>
        
        <div class="weekdays">
            <div>อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div>ส</div>
        </div>
        
        <div class="days" id="calendarDays"></div>
    </div>

    <!-- Modal สำหรับบันทึก -->
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <h3 id="modalDateTitle">วันที่</h3>
            
            <div class="form-group">
                <label>
                    <input type="checkbox" id="isPeriod"> มีประจำเดือน 🩸
                </label>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="isSex"> มีเพศสัมพันธ์ <span style="color: var(--accent-brown-heart);">🤎</span>
                </label>
            </div>
            
            <div class="form-group">
                <label for="noteText">บันทึกโน้ต:</label>
                <textarea id="noteText" rows="3" placeholder="พิมพ์บันทึกที่นี่..."></textarea>
            </div>
            
            <div class="modal-buttons">
                <button class="btn-cancel" id="cancelBtn">ยกเลิก</button>
                <button class="btn-save" id="saveBtn">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        let trackerData = JSON.parse(localStorage.getItem('periodTrackerDataCustomTheme')) || {};
        
        const calendarDays = document.getElementById('calendarDays');
        const monthYear = document.getElementById('monthYear');
        const noteModal = document.getElementById('noteModal');
        const modalDateTitle = document.getElementById('modalDateTitle');
        const isPeriodCheckbox = document.getElementById('isPeriod');
        const isSexCheckbox = document.getElementById('isSex');
        const noteText = document.getElementById('noteText');
        const multiSelectMode = document.getElementById('multiSelectMode');
        const actionHint = document.getElementById('actionHint');
        
        let currentDate = new Date();
        let selectedDateStr = "";
        let startDateKey = null;

        const thaiMonths = [
            "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
            "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
        ];

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            monthYear.textContent = `${thaiMonths[month]} ${year + 543}`;
            calendarDays.innerHTML = '';

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                calendarDays.appendChild(document.createElement('div'));
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.classList.add('day');

                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                const numSpan = document.createElement('div');
                numSpan.classList.add('day-number');
                numSpan.textContent = i;
                dayDiv.appendChild(numSpan);

                const emojiContainer = document.createElement('div');
                emojiContainer.classList.add('day-emojis');

                if (trackerData[dateKey]) {
                    if (trackerData[dateKey].isPeriod) {
                        dayDiv.classList.add('period'); // กรอบสีเขียวมินต์เมื่อเป็นเมนส์
                        emojiContainer.innerHTML += '🩸';
                    }
                    if (trackerData[dateKey].isSex) {
                        emojiContainer.innerHTML += '🤎'; // หัวใจสีน้ำตาล
                    }
                    if (trackerData[dateKey].note && trackerData[dateKey].note.trim() !== "") {
                        emojiContainer.innerHTML += '📝';
                    }
                }

                dayDiv.appendChild(emojiContainer);
                dayDiv.addEventListener('click', () => handleDayClick(dateKey, i, month, year));
                calendarDays.appendChild(dayDiv);
            }
        }

        function handleDayClick(dateKey, day, month, year) {
            if (multiSelectMode.checked) {
                if (!startDateKey) {
                    startDateKey = dateKey;
                    actionHint.style.display = 'inline';
                } else {
                    applyMultiSelectPeriod(startDateKey, dateKey);
                    startDateKey = null;
                    multiSelectMode.checked = false;
                    actionHint.style.display = 'none';
                    renderCalendar();
                }
            } else {
                openModal(dateKey, day, month, year);
            }
        }

        function applyMultiSelectPeriod(startStr, endStr) {
            let start = new Date(startStr);
            let end = new Date(endStr);

            if (start > end) {
                let temp = start; start = end; end = temp;
            }

            let curr = new Date(start);
            while (curr <= end) {
                let y = curr.getFullYear();
                let m = String(curr.getMonth() + 1).padStart(2, '0');
                let d = String(curr.getDate()).padStart(2, '0');
                let key = `${y}-${m}-${d}`;

                if (!trackerData[key]) trackerData[key] = { isPeriod: false, isSex: false, note: "" };
                trackerData[key].isPeriod = true;

                curr.setDate(curr.getDate() + 1);
            }
            localStorage.setItem('periodTrackerDataCustomTheme', JSON.stringify(trackerData));
        }

        function openModal(dateKey, day, month, year) {
            selectedDateStr = dateKey;
            modalDateTitle.textContent = `วันที่ ${day} ${thaiMonths[month]} ${year + 543}`;
            
            if (trackerData[dateKey]) {
                isPeriodCheckbox.checked = trackerData[dateKey].isPeriod || false;
                isSexCheckbox.checked = trackerData[dateKey].isSex || false;
                noteText.value = trackerData[dateKey].note || "";
            } else {
                isPeriodCheckbox.checked = false;
                isSexCheckbox.checked = false;
                noteText.value = "";
            }
            
            noteModal.style.display = 'flex';
        }

        function closeModal() {
            noteModal.style.display = 'none';
        }

        function saveData() {
            if (!trackerData[selectedDateStr]) {
                trackerData[selectedDateStr] = {};
            }
            
            trackerData[selectedDateStr].isPeriod = isPeriodCheckbox.checked;
            trackerData[selectedDateStr].isSex = isSexCheckbox.checked;
            trackerData[selectedDateStr].note = noteText.value;
            
            if (!trackerData[selectedDateStr].isPeriod && !trackerData[selectedDateStr].isSex && trackerData[selectedDateStr].note.trim() === "") {
                delete trackerData[selectedDateStr];
            }
            
            localStorage.setItem('periodTrackerDataCustomTheme', JSON.stringify(trackerData));
            closeModal();
            renderCalendar();
        }

        multiSelectMode.addEventListener('change', () => {
            startDateKey = null;
            actionHint.style.display = 'none';
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        document.getElementById('cancelBtn').addEventListener('click', closeModal);
        document.getElementById('saveBtn').addEventListener('click', saveData);
        
        window.addEventListener('click', (e) => {
            if (e.target === noteModal) closeModal();
        });

        renderCalendar();
    </script>
</body>
</html>
