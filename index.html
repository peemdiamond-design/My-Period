<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปฏิทินบันทึกประจำเดือน 🍫 Mint & Choc</title>
    <style>
        :root {
            --mint-bg: #c7ecee;
            --mint-light: #e0f6f7;
            --choc-dark: #4b2e2b;
            --choc-main: #6f4e37;
            --choc-light: #8d5b4c;
            --accent-pink: #ff6b81;
            --accent-purple: #9b59b6;
            --white: #fffcf9;
            --cream: #fff5eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--mint-bg);
            /* ลวดลายดาวพื้นหลังแนวพาสเทล */
            background-image: 
                radial-gradient(#ffffff 15%, transparent 16%),
                radial-gradient(#ffffff 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--choc-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--cream);
            border: 4px solid var(--choc-main);
            border-radius: 20px;
            box-shadow: 0 12px 25px rgba(75, 46, 43, 0.25);
            width: 100%;
            max-width: 480px;
            padding: 25px;
            position: relative;
        }

        /* ตกแต่งหัวข้อแนวบล็อกช็อกโกแลต */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--choc-dark);
            padding: 12px 15px;
            border-radius: 12px;
            color: var(--white);
            margin-bottom: 20px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.3);
        }

        .header h2 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 1px;
            font-family: serif;
        }

        .header button {
            background-color: var(--choc-main);
            color: var(--white);
            border: 2px solid var(--choc-light);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .header button:hover {
            background-color: var(--choc-light);
            transform: scale(1.05);
        }

        .mode-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--mint-light);
            border: 2px dashed var(--choc-main);
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .mode-selector label {
            cursor: pointer;
            font-weight: bold;
            color: var(--choc-dark);
        }

        .mode-selector input[type="checkbox"] {
            accent-color: var(--choc-main);
            transform: scale(1.2);
            cursor: pointer;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--choc-main);
            font-size: 14px;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background-color: var(--white);
            border: 2px solid #e2d2c3;
            border-radius: 10px;
            cursor: pointer;
            padding: 6px 2px;
            font-size: 13px;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .day:hover {
            background-color: var(--mint-light);
            border-color: var(--choc-main);
            transform: translateY(-2px);
        }

        .day.period {
            background-color: #ffeef2;
            border-color: var(--accent-pink);
        }

        .day-number {
            font-weight: bold;
            color: var(--choc-dark);
        }

        .day-emojis {
            display: flex;
            gap: 2px;
            font-size: 10px;
            min-height: 14px;
        }

        /* Modal Styles (หน้าต่างบันทึก) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(75, 46, 43, 0.6);
            backdrop-filter: blur(3px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--cream);
            border: 3px solid var(--choc-main);
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 340px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .modal h3 {
            margin-top: 0;
            color: var(--choc-dark);
            font-family: serif;
            border-bottom: 2px dashed var(--choc-main);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            cursor: pointer;
            font-weight: 500;
            color: var(--choc-dark);
        }

        .form-group input[type="checkbox"] {
            accent-color: var(--choc-main);
            transform: scale(1.1);
        }

        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2d2c3;
            background-color: var(--white);
            border-radius: 8px;
            resize: none;
            box-sizing: border-box;
            color: var(--choc-dark);
            font-family: inherit;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: var(--choc-main);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-buttons button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-save { 
            background-color: var(--choc-main); 
            color: var(--white); 
            border: 2px solid var(--choc-dark);
        }
        .btn-save:hover { background-color: var(--choc-dark); }
        
        .btn-cancel { 
            background-color: #dcdde1; 
            color: #57606f; 
        }
        .btn-cancel:hover { background-color: #bdc5c8; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <button id="prevBtn">&lt;</button>
            <h2 id="monthYear"></h2>
            <button id="nextBtn">&gt;</button>
        </div>
        
        <div class="mode-selector">
            <label>
                <input type="checkbox" id="multiSelectMode"> โหมดเลือกหลายวัน (ประจำเดือน)
            </label>
            <span id="actionHint" style="font-size: 11px; color: var(--accent-pink); font-weight: bold; display: none;">คลิกเลือกวันสิ้นสุด</span>
        </div>
        
        <div class="weekdays">
            <div>อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div>ส</div>
        </div>
        
        <div class="days" id="calendarDays"></div>
    </div>

    <!-- Modal สำหรับเพิ่มโน้ตและ Sex -->
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <h3 id="modalDateTitle">วันที่</h3>
            
            <div class="form-group">
                <label>
                    <input type="checkbox" id="isPeriod"> วันนี้มีประจำเดือน 🩸
                </label>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="isSex"> มีเพศสัมพันธ์ 💜
                </label>
            </div>
            
            <div class="form-group">
                <label for="noteText">บันทึกอาการหรือโน้ตเพิ่มเติม:</label>
                <textarea id="noteText" rows="3" placeholder="เช่น ปวดท้อง, อารมณ์แปรปรวน..."></textarea>
            </div>
            
            <div class="modal-buttons">
                <button class="btn-cancel" id="cancelBtn">ยกเลิก</button>
                <button class="btn-save" id="saveBtn">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        let trackerData = JSON.parse(localStorage.getItem('periodTrackerDataMint')) || {};
        
        const calendarDays = document.getElementById('calendarDays');
        const monthYear = document.getElementById('monthYear');
        const noteModal = document.getElementById('noteModal');
        const modalDateTitle = document.getElementById('modalDateTitle');
        const isPeriodCheckbox = document.getElementById('isPeriod');
        const isSexCheckbox = document.getElementById('isSex');
        const noteText = document.getElementById('noteText');
        const multiSelectMode = document.getElementById('multiSelectMode');
        const actionHint = document.getElementById('actionHint');
        
        let currentDate = new Date();
        let selectedDateStr = "";
        let startDateKey = null;

        const thaiMonths = [
            "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
            "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
        ];

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            monthYear.textContent = `${thaiMonths[month]} ${year + 543}`;
            calendarDays.innerHTML = '';

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                calendarDays.appendChild(document.createElement('div'));
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.classList.add('day');

                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                const numSpan = document.createElement('div');
                numSpan.classList.add('day-number');
                numSpan.textContent = i;
                dayDiv.appendChild(numSpan);

                const emojiContainer = document.createElement('div');
                emojiContainer.classList.add('day-emojis');

                if (trackerData[dateKey]) {
                    if (trackerData[dateKey].isPeriod) {
                        dayDiv.classList.add('period');
                        emojiContainer.innerHTML += '🩸';
                    }
                    if (trackerData[dateKey].isSex) {
                        emojiContainer.innerHTML += '💜';
                    }
                    if (trackerData[dateKey].note && trackerData[dateKey].note.trim() !== "") {
                        emojiContainer.innerHTML += '📝';
                    }
                }

                dayDiv.appendChild(emojiContainer);
                dayDiv.addEventListener('click', () => handleDayClick(dateKey, i, month, year));
                calendarDays.appendChild(dayDiv);
            }
        }

        function handleDayClick(dateKey, day, month, year) {
            if (multiSelectMode.checked) {
                if (!startDateKey) {
                    startDateKey = dateKey;
                    actionHint.style.display = 'inline';
                } else {
                    applyMultiSelectPeriod(startDateKey, dateKey);
                    startDateKey = null;
                    multiSelectMode.checked = false;
                    actionHint.style.display = 'none';
                    renderCalendar();
                }
            } else {
                openModal(dateKey, day, month, year);
            }
        }

        function applyMultiSelectPeriod(startStr, endStr) {
            let start = new Date(startStr);
            let end = new Date(endStr);

            if (start > end) {
                let temp = start; start = end; end = temp;
            }

            let curr = new Date(start);
            while (curr <= end) {
                let y = curr.getFullYear();
                let m = String(curr.getMonth() + 1).padStart(2, '0');
                let d = String(curr.getDate()).padStart(2, '0');
                let key = `${y}-${m}-${d}`;

                if (!trackerData[key]) trackerData[key] = { isPeriod: false, isSex: false, note: "" };
                trackerData[key].isPeriod = true;

                curr.setDate(curr.getDate() + 1);
            }
            localStorage.setItem('periodTrackerDataMint', JSON.stringify(trackerData));
        }

        function openModal(dateKey, day, month, year) {
            selectedDateStr = dateKey;
            modalDateTitle.textContent = `บันทึกวันที่ ${day} ${thaiMonths[month]} ${year + 543}`;
            
            if (trackerData[dateKey]) {
                isPeriodCheckbox.checked = trackerData[dateKey].isPeriod || false;
                isSexCheckbox.checked = trackerData[dateKey].isSex || false;
                noteText.value = trackerData[dateKey].note || "";
            } else {
                isPeriodCheckbox.checked = false;
                isSexCheckbox.checked = false;
                noteText.value = "";
            }
            
            noteModal.style.display = 'flex';
        }

        function closeModal() {
            noteModal.style.display = 'none';
        }

        function saveData() {
            if (!trackerData[selectedDateStr]) {
                trackerData[selectedDateStr] = {};
            }
            
            trackerData[selectedDateStr].isPeriod = isPeriodCheckbox.checked;
            trackerData[selectedDateStr].isSex = isSexCheckbox.checked;
            trackerData[selectedDateStr].note = noteText.value;
            
            if (!trackerData[selectedDateStr].isPeriod && !trackerData[selectedDateStr].isSex && trackerData[selectedDateStr].note.trim() === "") {
                delete trackerData[selectedDateStr];
            }
            
            localStorage.setItem('periodTrackerDataMint', JSON.stringify(trackerData));
            closeModal();
            renderCalendar();
        }

        multiSelectMode.addEventListener('change', () => {
            startDateKey = null;
            actionHint.style.display = 'none';
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        document.getElementById('cancelBtn').addEventListener('click', closeModal);
        document.getElementById('saveBtn').addEventListener('click', saveData);
        
        window.addEventListener('click', (e) => {
            if (e.target === noteModal) closeModal();
        });

        renderCalendar();
    </script>
</body>
</html>
