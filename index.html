<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปฏิทินบันทึกประจำเดือน</title>
    <style>
        :root {
            --primary-color: #ff6b81;
            --secondary-color: #9b59b6;
            --bg-color: #fce4ec;
            --text-color: #333;
            --white: #fff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--white);
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header button {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .header button:hover {
            background-color: #ff4757;
        }

        .mode-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f1f2f6;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .mode-selector label {
            cursor: pointer;
            font-weight: bold;
            color: #57606f;
        }

        .mode-selector input[type="checkbox"] {
            transform: scale(1.2);
            cursor: pointer;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            color: #747d8c;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f1f2f6;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            font-size: 14px;
            transition: all 0.2s;
        }

        .day:hover {
            background-color: #dfe4ea;
        }

        .day.period {
            background-color: var(--primary-color);
            color: var(--white);
        }

        .day.multi-selected {
            border: 2px dashed var(--primary-color);
            background-color: #fff0f3;
        }

        .indicators {
            display: flex;
            gap: 3px;
            position: absolute;
            bottom: 5px;
        }

        .dot-note { width: 5px; height: 5px; background-color: #2ed573; border-radius: 50%; }
        .dot-sex { width: 5px; height: 5px; background-color: var(--secondary-color); border-radius: 50%; }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--white);
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 350px;
        }

        .modal h3 {
            margin-top: 0;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
            box-sizing: border-box;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-buttons button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-save { background-color: var(--primary-color); color: var(--white); }
        .btn-cancel { background-color: #ccc; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <button id="prevBtn">&lt;</button>
            <h2 id="monthYear"></h2>
            <button id="nextBtn">&gt;</button>
        </div>
        
        <div class="mode-selector">
            <label>
                <input type="checkbox" id="multiSelectMode"> โหมดเลือกหลายวัน (ประจำเดือน)
            </label>
            <span id="actionHint" style="font-size: 12px; color: #ff4757; display: none;">คลิกเลือกวันสิ้นสุด</span>
        </div>
        
        <div class="weekdays">
            <div>อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div>ส</div>
        </div>
        
        <div class="days" id="calendarDays"></div>
    </div>

    <!-- Modal สำหรับเพิ่มโน้ตและ Sex -->
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <h3 id="modalDateTitle">วันที่</h3>
            
            <div class="form-group">
                <label>
                    <input type="checkbox" id="isPeriod"> วันนี้มีประจำเดือน 🩸
                </label>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="isSex"> มีเพศสัมพันธ์ 💜
                </label>
            </div>
            
            <div class="form-group">
                <label for="noteText">บันทึกอาการหรือโน้ตเพิ่มเติม:</label>
                <textarea id="noteText" rows="3" placeholder="เช่น ปวดท้อง, อารมณ์แปรปรวน..."></textarea>
            </div>
            
            <div class="modal-buttons">
                <button class="btn-cancel" id="cancelBtn">ยกเลิก</button>
                <button class="btn-save" id="saveBtn">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        let trackerData = JSON.parse(localStorage.getItem('periodTrackerData')) || {};
        
        const calendarDays = document.getElementById('calendarDays');
        const monthYear = document.getElementById('monthYear');
        const noteModal = document.getElementById('noteModal');
        const modalDateTitle = document.getElementById('modalDateTitle');
        const isPeriodCheckbox = document.getElementById('isPeriod');
        const isSexCheckbox = document.getElementById('isSex');
        const noteText = document.getElementById('noteText');
        const multiSelectMode = document.getElementById('multiSelectMode');
        const actionHint = document.getElementById('actionHint');
        
        let currentDate = new Date();
        let selectedDateStr = "";
        
        // ตัวแปรสำหรับโหมดเลือกหลายวัน
        let isMultiSelecting = false;
        let startDateKey = null;

        const thaiMonths = [
            "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
            "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
        ];

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            monthYear.textContent = `${thaiMonths[month]} ${year + 543}`;
            calendarDays.innerHTML = '';

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                calendarDays.appendChild(document.createElement('div'));
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.classList.add('day');
                dayDiv.textContent = i;

                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                if (trackerData[dateKey]) {
                    if (trackerData[dateKey].isPeriod) dayDiv.classList.add('period');
                    
                    const indicators = document.createElement('div');
                    indicators.classList.add('indicators');
                    
                    if (trackerData[dateKey].isSex) {
                        const sexDot = document.createElement('div');
                        sexDot.classList.add('dot-sex');
                        indicators.appendChild(sexDot);
                    }
                    if (trackerData[dateKey].note && trackerData[dateKey].note.trim() !== "") {
                        const noteDot = document.createElement('div');
                        noteDot.classList.add('dot-note');
                        indicators.appendChild(noteDot);
                    }
                    dayDiv.appendChild(indicators);
                }

                // Event คลิกเลือกวัน
                dayDiv.addEventListener('click', () => handleDayClick(dateKey, i, month, year));
                
                calendarDays.appendChild(dayDiv);
            }
        }

        function handleDayClick(dateKey, day, month, year) {
            if (multiSelectMode.checked) {
                if (!startDateKey) {
                    startDateKey = dateKey;
                    actionHint.style.display = 'inline';
                    // ทำไฮไลต์วันแรก
                    renderCalendar();
                } else {
                    // ทำการบันทึกประจำเดือนยาวตั้งแต่ startDateKey ถึง dateKey ปัจจุบัน
                    applyMultiSelectPeriod(startDateKey, dateKey);
                    startDateKey = null;
                    multiSelectMode.checked = false;
                    actionHint.style.display = 'none';
                    renderCalendar();
                }
            } else {
                openModal(dateKey, day, month, year);
            }
        }

        function applyMultiSelectPeriod(startStr, endStr) {
            let start = new Date(startStr);
            let end = new Date(endStr);

            if (start > end) {
                let temp = start; start = end; end = temp;
            }

            let curr = new Date(start);
            while (curr <= end) {
                let y = curr.getFullYear();
                let m = String(curr.getMonth() + 1).padStart(2, '0');
                let d = String(curr.getDate()).padStart(2, '0');
                let key = `${y}-${m}-${d}`;

                if (!trackerData[key]) trackerData[key] = { isPeriod: false, isSex: false, note: "" };
                trackerData[key].isPeriod = true;

                curr.setDate(curr.getDate() + 1);
            }
            localStorage.setItem('periodTrackerData', JSON.stringify(trackerData));
        }

        function openModal(dateKey, day, month, year) {
            selectedDateStr = dateKey;
            modalDateTitle.textContent = `บันทึกวันที่ ${day} ${thaiMonths[month]} ${year + 543}`;
            
            if (trackerData[dateKey]) {
                isPeriodCheckbox.checked = trackerData[dateKey].isPeriod || false;
                isSexCheckbox.checked = trackerData[dateKey].isSex || false;
                noteText.value = trackerData[dateKey].note || "";
            } else {
                isPeriodCheckbox.checked = false;
                isSexCheckbox.checked = false;
                noteText.value = "";
            }
            
            noteModal.style.display = 'flex';
        }

        function closeModal() {
            noteModal.style.display = 'none';
        }

        function saveData() {
            if (!trackerData[selectedDateStr]) {
                trackerData[selectedDateStr] = {};
            }
            
            trackerData[selectedDateStr].isPeriod = isPeriodCheckbox.checked;
            trackerData[selectedDateStr].isSex = isSexCheckbox.checked;
            trackerData[selectedDateStr].note = noteText.value;
            
            // ลบข้อมูลทิ้งถ้าไม่มีการติ๊กหรือจดอะไรเลย เพื่อประหยัดพื้นที่
            if (!trackerData[selectedDateStr].isPeriod && !trackerData[selectedDateStr].isSex && trackerData[selectedDateStr].note.trim() === "") {
                delete trackerData[selectedDateStr];
            }
            
            localStorage.setItem('periodTrackerData', JSON.stringify(trackerData));
            closeModal();
            renderCalendar();
        }

        multiSelectMode.addEventListener('change', () => {
            startDateKey = null;
            actionHint.style.display = 'none';
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        document.getElementById('cancelBtn').addEventListener('click', closeModal);
        document.getElementById('saveBtn').addEventListener('click', saveData);
        
        window.addEventListener('click', (e) => {
            if (e.target === noteModal) closeModal();
        });

        renderCalendar();
    </script>
</body>
</html>
