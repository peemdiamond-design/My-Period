<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dart's Period</title>
    <!-- Import Playfair Display font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --mint-main: #a8e6cf;
            --mint-box: rgba(224, 246, 247, 0.95);
            --choc-dark: #4b2e2b;
            --choc-bar: #5c3a21;
            --choc-border: #38220f;
            --accent-pink: #ff6b81;
            --accent-brown-heart: #a0522d;
            --white: rgba(255, 252, 249, 0.95);
        }

        body {
            font-family: 'Playfair Display', serif;
            /* Background image */
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--choc-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-size: 16px;
        }

        .container {
            background-color: var(--white);
            border: 4px solid var(--choc-border);
            box-shadow: 6px 6px 0px var(--choc-dark);
            width: 100%;
            max-width: 460px;
            padding: 25px 20px 20px 20px;
            position: relative;
            backdrop-filter: blur(2px);
        }

        .bow-decoration {
            position: absolute;
            top: -25px;
            right: -15px;
            font-size: 36px;
            filter: drop-shadow(2px 2px 0px var(--choc-dark));
            z-index: 10;
        }

        /* Styling for the new main title */
        .main-title {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            color: var(--choc-dark);
            margin-top: 0;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px var(--mint-main);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--choc-bar);
            border: 3px solid var(--choc-border);
            padding: 10px 15px;
            color: #fff;
            margin-bottom: 15px;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.3);
        }

        .header h2 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .header button {
            background-color: var(--mint-main);
            color: var(--choc-dark);
            border: 2px solid var(--choc-border);
            padding: 4px 12px;
            cursor: pointer;
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 2px 2px 0px var(--choc-border);
        }

        .header button:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .mode-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--mint-box);
            border: 2px dashed var(--choc-bar);
            padding: 8px 12px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .mode-selector label {
            cursor: pointer;
            font-weight: bold;
            color: var(--choc-dark);
        }

        .mode-selector input[type="checkbox"] {
            accent-color: var(--choc-bar);
            transform: scale(1.2);
            cursor: pointer;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--choc-bar);
            font-size: 16px;
            text-shadow: 1px 1px 0px #fff;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background-color: var(--white);
            cursor: pointer;
            padding: 6px 2px;
            font-size: 15px;
            box-sizing: border-box;
            border: 2px solid var(--choc-bar);
            box-shadow: 2px 2px 0px rgba(75, 46, 43, 0.3);
        }

        .day:hover {
            background-color: var(--mint-box);
        }

        .day.period {
            background-color: #f2fcf7;
            border: 2px solid #2ed573;
            box-shadow: 2px 2px 0px rgba(46, 213, 115, 0.5);
        }

        .day-number {
            font-weight: bold;
            color: var(--choc-dark);
        }

        .day-emojis {
            display: flex;
            gap: 1px;
            font-size: 12px;
            min-height: 14px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(75, 46, 43, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #fffcf9;
            border: 4px solid var(--choc-bar);
            box-shadow: 6px 6px 0px var(--choc-dark);
            padding: 20px;
            width: 90%;
            max-width: 320px;
        }

        .modal h3 {
            margin-top: 0;
            color: var(--choc-dark);
            border-bottom: 2px dashed var(--choc-bar);
            padding-bottom: 6px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            cursor: pointer;
            color: var(--choc-dark);
            font-size: 14px;
        }

        .form-group input[type="checkbox"] {
            accent-color: var(--choc-bar);
            transform: scale(1.2);
        }

        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 2px solid var(--choc-bar);
            background-color: #e0f6f7;
            resize: none;
            box-sizing: border-box;
            color: var(--choc-dark);
            font-family: 'Playfair Display', serif;
            font-size: 14px;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: var(--choc-dark);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-buttons button {
            padding: 6px 14px;
            border: 2px solid var(--choc-border);
            cursor: pointer;
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 2px 2px 0px var(--choc-border);
        }

        .btn-save { 
            background-color: var(--mint-main); 
            color: var(--choc-dark); 
        }
        .btn-save:active { transform: translate(2px, 2px); box-shadow: none; }
        
        .btn-cancel { 
            background-color: #dcdde1; 
            color: #57606f; 
        }
        .btn-cancel:active { transform: translate(2px, 2px); box-shadow: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="bow-decoration">🎀</div>

        <!-- Added Title Here -->
        <h1 class="main-title">Dart’s Period</h1>

        <div class="header">
            <button id="prevBtn">&lt;</button>
            <h2 id="monthYear"></h2>
            <button id="nextBtn">&gt;</button>
        </div>
        
        <div class="mode-selector">
            <label>
                <input type="checkbox" id="multiSelectMode"> Multi-select (🩸)
            </label>
            <span id="actionHint" style="font-size: 13px; color: var(--accent-pink); font-weight: bold; display: none;">Select end date</span>
        </div>
        
        <div class="weekdays">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        
        <div class="days" id="calendarDays"></div>
    </div>

    <div class="modal" id="noteModal">
        <div class="modal-content">
            <h3 id="modalDateTitle">Date</h3>
            
            <div class="form-group">
                <label>
                    <input type="checkbox" id="isPeriod"> Period 🩸
                </label>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="isSex"> Sexual Activity <span style="color: var(--accent-brown-heart);">🤎</span>
                </label>
            </div>
            
            <div class="form-group">
                <label for="noteText">Notes:</label>
                <textarea id="noteText" rows="3" placeholder="Write your notes here..."></textarea>
            </div>
            
            <div class="modal-buttons">
                <button class="btn-cancel" id="cancelBtn">Cancel</button>
                <button class="btn-save" id="saveBtn">Save</button>
            </div>
        </div>
    </div>

    <script>
        let trackerData = JSON.parse(localStorage.getItem('periodTrackerDataEnglish')) || {};
        
        const calendarDays = document.getElementById('calendarDays');
        const monthYear = document.getElementById('monthYear');
        const noteModal = document.getElementById('noteModal');
        const modalDateTitle = document.getElementById('modalDateTitle');
        const isPeriodCheckbox = document.getElementById('isPeriod');
        const isSexCheckbox = document.getElementById('isSex');
        const noteText = document.getElementById('noteText');
        const multiSelectMode = document.getElementById('multiSelectMode');
        const actionHint = document.getElementById('actionHint');
        
        let currentDate = new Date();
        let selectedDateStr = "";
        let startDateKey = null;

        const englishMonths = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            monthYear.textContent = `${englishMonths[month]} ${year}`;
            calendarDays.innerHTML = '';

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                calendarDays.appendChild(document.createElement('div'));
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.classList.add('day');

                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                const numSpan = document.createElement('div');
                numSpan.classList.add('day-number');
                numSpan.textContent = i;
                dayDiv.appendChild(numSpan);

                const emojiContainer = document.createElement('div');
                emojiContainer.classList.add('day-emojis');

                if (trackerData[dateKey]) {
                    if (trackerData[dateKey].isPeriod) {
                        dayDiv.classList.add('period');
                        emojiContainer.innerHTML += '🩸';
                    }
                    if (trackerData[dateKey].isSex) {
                        emojiContainer.innerHTML += '🤎';
                    }
                    if (trackerData[dateKey].note && trackerData[dateKey].note.trim() !== "") {
                        emojiContainer.innerHTML += '📝';
                    }
                }

                dayDiv.appendChild(emojiContainer);
                dayDiv.addEventListener('click', () => handleDayClick(dateKey, i, month, year));
                calendarDays.appendChild(dayDiv);
            }
        }

        function handleDayClick(dateKey, day, month, year) {
            if (multiSelectMode.checked) {
                if (!startDateKey) {
                    startDateKey = dateKey;
                    actionHint.style.display = 'inline';
                } else {
                    applyMultiSelectPeriod(startDateKey, dateKey);
                    startDateKey = null;
                    multiSelectMode.checked = false;
                    actionHint.style.display = 'none';
                    renderCalendar();
                }
            } else {
                openModal(dateKey, day, month, year);
            }
        }

        function applyMultiSelectPeriod(startStr, endStr) {
            let start = new Date(startStr);
            let end = new Date(endStr);

            if (start > end) {
                let temp = start; start = end; end = temp;
            }

            let curr = new Date(start);
            while (curr <= end) {
                let y = curr.getFullYear();
                let m = String(curr.getMonth() + 1).padStart(2, '0');
                let d = String(curr.getDate()).padStart(2, '0');
                let key = `${y}-${m}-${d}`;

                if (!trackerData[key]) trackerData[key] = { isPeriod: false, isSex: false, note: "" };
                trackerData[key].isPeriod = true;

                curr.setDate(curr.getDate() + 1);
            }
            localStorage.setItem('periodTrackerDataEnglish', JSON.stringify(trackerData));
        }

        function openModal(dateKey, day, month, year) {
            selectedDateStr = dateKey;
            modalDateTitle.textContent = `Date: ${englishMonths[month]} ${day}, ${year}`;
            
            if (trackerData[dateKey]) {
                isPeriodCheckbox.checked = trackerData[dateKey].isPeriod || false;
                isSexCheckbox.checked = trackerData[dateKey].isSex || false;
                noteText.value = trackerData[dateKey].note || "";
            } else {
                isPeriodCheckbox.checked = false;
                isSexCheckbox.checked = false;
                noteText.value = "";
            }
            
            noteModal.style.display = 'flex';
        }

        function closeModal() {
            noteModal.style.display = 'none';
        }

        function saveData() {
            if (!trackerData[selectedDateStr]) {
                trackerData[selectedDateStr] = {};
            }
            
            trackerData[selectedDateStr].isPeriod = isPeriodCheckbox.checked;
            trackerData[selectedDateStr].isSex = isSexCheckbox.checked;
            trackerData[selectedDateStr].note = noteText.value;
            
            if (!trackerData[selectedDateStr].isPeriod && !trackerData[selectedDateStr].isSex && trackerData[selectedDateStr].note.trim() === "") {
                delete trackerData[selectedDateStr];
            }
            
            localStorage.setItem('periodTrackerDataEnglish', JSON.stringify(trackerData));
            closeModal();
            renderCalendar();
        }

        multiSelectMode.addEventListener('change', () => {
            startDateKey = null;
            actionHint.style.display = 'none';
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        document.getElementById('cancelBtn').addEventListener('click', closeModal);
        document.getElementById('saveBtn').addEventListener('click', saveData);
        
        window.addEventListener('click', (e) => {
            if (e.target === noteModal) closeModal();
        });

        renderCalendar();
    </script>
</body>
</html>
