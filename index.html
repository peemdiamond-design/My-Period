<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dart's Period - Cloud Sync</title>
    <!-- Import Playfair Display font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* Default Theme: Mint & Choc */
        :root {
            --mint-main: #a8e6cf;
            --mint-box: rgba(224, 246, 247, 0.95);
            --choc-dark: #4b2e2b;
            --choc-bar: #5c3a21;
            --choc-border: #38220f;
            --accent-pink: #ff6b81;
            --accent-brown-heart: #a0522d;
            --white: rgba(255, 252, 249, 0.95);
        }

        /* Theme: Strawberry & Choc */
        body.theme-strawberry {
            --mint-main: #ffb7b2;
            --mint-box: rgba(255, 235, 238, 0.95);
        }

        /* Theme: Matcha & Choc */
        body.theme-matcha {
            --mint-main: #c1d5a4;
            --mint-box: rgba(233, 245, 219, 0.95);
        }

        body {
            font-family: 'Playfair Display', serif;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--choc-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .container {
            background-color: var(--white);
            border: 4px solid var(--choc-border);
            box-shadow: 6px 6px 0px var(--choc-dark);
            width: 100%;
            max-width: 460px;
            padding: 25px 20px 20px 20px;
            position: relative;
            backdrop-filter: blur(2px);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .bow-decoration {
            position: absolute;
            top: -25px;
            right: -15px;
            font-size: 36px;
            filter: drop-shadow(2px 2px 0px var(--choc-dark));
            z-index: 10;
        }

        .main-title {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            color: var(--choc-dark);
            margin-top: 0;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px var(--mint-main);
            transition: text-shadow 0.3s ease;
        }

        /* Cloud sync indicator */
        .sync-status {
            text-align: center;
            font-size: 12px;
            color: #27ae60;
            margin-bottom: 15px;
            font-weight: bold;
            font-family: sans-serif;
        }
        
        .sync-status.loading {
            color: #f39c12;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--choc-bar);
            border: 3px solid var(--choc-border);
            padding: 10px 15px;
            color: #fff;
            margin-bottom: 15px;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.3);
        }

        .header h2 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .header button {
            background-color: var(--mint-main);
            color: var(--choc-dark);
            border: 2px solid var(--choc-border);
            padding: 4px 12px;
            cursor: pointer;
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 2px 2px 0px var(--choc-border);
            transition: background-color 0.3s ease;
        }

        .header button:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .theme-selector, .mode-selector {
            background-color: var(--mint-box);
            border: 2px dashed var(--choc-bar);
            padding: 8px 12px;
            font-size: 14px;
            display: flex;
            align-items: center;
            color: var(--choc-dark);
            font-weight: bold;
            flex: 1;
        }

        .theme-selector select {
            margin-left: 8px;
            font-family: 'Playfair Display', serif;
            font-weight: bold;
            color: var(--choc-dark);
            background: transparent;
            border: 1px solid var(--choc-bar);
            outline: none;
            cursor: pointer;
            width: 100%;
        }

        .mode-selector label {
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .mode-selector input[type="checkbox"] {
            accent-color: var(--choc-bar);
            transform: scale(1.2);
            cursor: pointer;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--choc-bar);
            font-size: 16px;
            text-shadow: 1px 1px 0px #fff;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 6px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background-color: var(--white);
            cursor: pointer;
            padding: 4px 2px;
            font-size: 15px;
            box-sizing: border-box;
            border: 2px solid var(--choc-border);
            box-shadow: 2px 2px 0px rgba(75, 46, 43, 0.3);
            transition: background-color 0.2s, border-color 0.3s;
            overflow: hidden;
        }

        .day:hover {
            background-color: var(--mint-box);
        }

        .day.period {
            background-color: var(--white);
            border: 3px solid var(--mint-main);
            box-shadow: 2px 2px 0px var(--mint-main);
        }

        .day-number {
            font-weight: bold;
            color: var(--choc-dark);
            margin-top: 2px;
        }

        .day-emojis {
            display: flex;
            gap: 2px;
            font-size: 12px;
            min-height: 16px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2px;
        }

        .virtual-pet {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 45px;
            z-index: 100;
            background: var(--white);
            border: 4px solid var(--choc-border);
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 4px 4px 0px var(--choc-dark);
            transition: all 0.3s;
            cursor: pointer;
            user-select: none;
        }

        .virtual-pet:hover {
            transform: scale(1.1);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(75, 46, 43, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #fffcf9;
            border: 4px solid var(--choc-bar);
            box-shadow: 6px 6px 0px var(--choc-dark);
            padding: 20px;
            width: 90%;
            max-width: 320px;
            box-sizing: border-box;
        }

        .modal h3 {
            margin-top: 0;
            color: var(--choc-dark);
            border-bottom: 2px dashed var(--choc-bar);
            padding-bottom: 6px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            cursor: pointer;
            color: var(--choc-dark);
            font-size: 14px;
        }

        .form-group input[type="checkbox"], .form-group input[type="radio"] {
            accent-color: var(--choc-bar);
            transform: scale(1.2);
        }

        .flow-options {
            display: none;
            margin-top: 8px;
            padding-left: 25px;
            flex-direction: column;
            gap: 5px;
        }

        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 2px solid var(--choc-bar);
            background-color: var(--mint-box);
            resize: none;
            box-sizing: border-box;
            color: var(--choc-dark);
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: var(--choc-dark);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-buttons button {
            padding: 6px 14px;
            border: 2px solid var(--choc-border);
            cursor: pointer;
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 2px 2px 0px var(--choc-border);
            transition: background-color 0.3s;
        }

        .btn-save { 
            background-color: var(--mint-main); 
            color: var(--choc-dark); 
        }
        .btn-save:active { transform: translate(2px, 2px); box-shadow: none; }
        
        .btn-cancel { 
            background-color: #dcdde1; 
            color: #57606f; 
        }
        .btn-cancel:active { transform: translate(2px, 2px); box-shadow: none; }

        .confetti-piece {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            transition: top 2s ease-in, opacity 2s ease-in;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="bow-decoration">🎀</div>

        <h1 class="main-title">Dart’s Period</h1>
        <!-- แสดงสถานะการเชื่อมต่อฐานข้อมูล -->
        <div id="syncStatus" class="sync-status loading">☁️ Connecting to cloud...</div>

        <div class="header">
            <button id="prevBtn">&lt;</button>
            <h2 id="monthYear"></h2>
            <button id="nextBtn">&gt;</button>
        </div>
        
        <div class="controls-row">
            <div class="theme-selector">
                🎨
                <select id="themeSelect">
                    <option value="mint">Mint & Choc</option>
                    <option value="strawberry">Strawberry</option>
                    <option value="matcha">Matcha & Choc</option>
                </select>
            </div>
            <div class="mode-selector">
                <label>
                    Multi-select 🩸
                    <input type="checkbox" id="multiSelectMode"> 
                </label>
            </div>
        </div>
        <div id="actionHint" style="font-size: 12px; color: var(--accent-pink); font-weight: bold; display: none; text-align: right; margin-top: -10px; margin-bottom: 10px;">Select end date...</div>
        
        <div class="weekdays">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        
        <div class="days" id="calendarDays"></div>
    </div>

    <!-- Virtual Pet -->
    <div class="virtual-pet" id="virtualPet" title="I'm here for you!">🐻✨</div>

    <!-- Modal -->
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <h3 id="modalDateTitle">Date</h3>
            
            <div class="form-group">
                <label>
                    <input type="checkbox" id="isPeriod"> Period 🩸
                </label>
                <div class="flow-options" id="flowOptions">
                    <label><input type="radio" name="flowLevel" value="Light"> Light 💧</label>
                    <label><input type="radio" name="flowLevel" value="Medium" checked> Medium 🩸</label>
                    <label><input type="radio" name="flowLevel" value="Heavy"> Heavy 🌊</label>
                </div>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="isSex"> Sexual Activity <span style="color: var(--accent-brown-heart);">🤎</span>
                </label>
            </div>
            
            <div class="form-group">
                <label for="noteText">Notes:</label>
                <textarea id="noteText" rows="3" placeholder="Write your notes here..."></textarea>
            </div>
            
            <div class="modal-buttons">
                <button class="btn-cancel" id="cancelBtn">Cancel</button>
                <button class="btn-save" id="saveBtn">Save</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCn3G9x20xeQjdHoImaekYZl-xavNq_oH0",
            authDomain: "my-period-d2e81.firebaseapp.com",
            projectId: "my-period-d2e81",
            storageBucket: "my-period-d2e81.firebasestorage.app",
            messagingSenderId: "128319941956",
            appId: "1:128319941956:web:032cc7e8536fc15f65bb11",
            measurementId: "G-0531GJELEV"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // Document Reference in Firestore (Collection: 'users', Document: 'dart_data')
        const docRef = doc(db, "users", "dart_data");

        // --- Application Logic ---
        let trackerData = {}; // Start empty, will load from Firebase
        
        // Elements
        const calendarDays = document.getElementById('calendarDays');
        const monthYear = document.getElementById('monthYear');
        const noteModal = document.getElementById('noteModal');
        const modalDateTitle = document.getElementById('modalDateTitle');
        const isPeriodCheckbox = document.getElementById('isPeriod');
        const flowOptionsDiv = document.getElementById('flowOptions');
        const flowRadios = document.getElementsByName('flowLevel');
        const isSexCheckbox = document.getElementById('isSex');
        const noteText = document.getElementById('noteText');
        const multiSelectMode = document.getElementById('multiSelectMode');
        const actionHint = document.getElementById('actionHint');
        const themeSelect = document.getElementById('themeSelect');
        const virtualPet = document.getElementById('virtualPet');
        const syncStatus = document.getElementById('syncStatus');
        
        let currentDate = new Date();
        let selectedDateStr = "";
        let startDateKey = null;

        const englishMonths = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        // --- Load Data from Firebase ---
        async function loadDataFromCloud() {
            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && Object.keys(docSnap.data()).length > 0) {
                    // ถ้าในคลาวด์มีข้อมูลอยู่แล้ว ให้ดึงมาใช้เลย
                    trackerData = docSnap.data();
                    syncStatus.textContent = "☁️ Synced to Cloud";
                    syncStatus.classList.remove('loading');
                } else {
                    // ถ้าคลาวด์ยังว่างเปล่า ให้ไปเอาข้อมูลเก่าที่เคยเซฟไว้ในเครื่องมาอัปโหลดขึ้นไปแทน
                    const localData = JSON.parse(localStorage.getItem('periodTrackerDataEnglish'));
                    if (localData && Object.keys(localData).length > 0) {
                        trackerData = localData;
                        await setDoc(docRef, trackerData);
                        syncStatus.textContent = "☁️ Old Data Uploaded to Cloud!";
                    } else {
                        trackerData = {}; 
                        syncStatus.textContent = "☁️ Ready to Sync";
                    }
                    syncStatus.classList.remove('loading');
                }
            } catch (error) {
                console.error("Error fetching data:", error);
                syncStatus.textContent = "⚠️ Cloud Error (Using offline mode)";
                syncStatus.classList.add('loading');
                // ถ้าเน็ตหลุด หรือ API โดนบล็อก ให้กลับไปใช้ข้อมูลในเครื่องชั่วคราว
                trackerData = JSON.parse(localStorage.getItem('periodTrackerDataEnglish')) || {};
            }
            renderCalendar();
        }

        // --- Save Data to Firebase ---
        async function saveDataToCloud() {
            syncStatus.textContent = "☁️ Saving...";
            syncStatus.classList.add('loading');
            
            // Save to LocalStorage as backup
            localStorage.setItem('periodTrackerDataEnglish', JSON.stringify(trackerData));

            try {
                await setDoc(docRef, trackerData);
                syncStatus.textContent = "☁️ Synced to Cloud";
                syncStatus.classList.remove('loading');
            } catch (error) {
                console.error("Error saving to cloud:", error);
                syncStatus.textContent = "⚠️ Save Error (Saved locally)";
            }
        }

        // --- Theme Management ---
        const savedTheme = localStorage.getItem('dartsTheme') || 'mint';
        themeSelect.value = savedTheme;
        applyTheme(savedTheme);

        themeSelect.addEventListener('change', (e) => {
            const theme = e.target.value;
            applyTheme(theme);
            localStorage.setItem('dartsTheme', theme);
        });

        function applyTheme(theme) {
            document.body.classList.remove('theme-strawberry', 'theme-matcha');
            if (theme === 'strawberry') document.body.classList.add('theme-strawberry');
            if (theme === 'matcha') document.body.classList.add('theme-matcha');
        }

        // --- Flow Options Toggle ---
        isPeriodCheckbox.addEventListener('change', () => {
            flowOptionsDiv.style.display = isPeriodCheckbox.checked ? 'flex' : 'none';
        });

        // --- Calendar Rendering ---
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            monthYear.textContent = `${englishMonths[month]} ${year}`;
            calendarDays.innerHTML = '';

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                calendarDays.appendChild(document.createElement('div'));
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.classList.add('day');

                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                const numSpan = document.createElement('div');
                numSpan.classList.add('day-number');
                numSpan.textContent = i;
                dayDiv.appendChild(numSpan);

                const emojiContainer = document.createElement('div');
                emojiContainer.classList.add('day-emojis');

                if (trackerData[dateKey]) {
                    if (trackerData[dateKey].isPeriod) {
                        dayDiv.classList.add('period');
                        let flowIcon = '🩸'; 
                        if (trackerData[dateKey].flow === 'Light') flowIcon = '💧';
                        else if (trackerData[dateKey].flow === 'Medium') flowIcon = '🩸';
                        else if (trackerData[dateKey].flow === 'Heavy') flowIcon = '🌊';
                        emojiContainer.innerHTML += flowIcon;
                    }
                    if (trackerData[dateKey].isSex) {
                        emojiContainer.innerHTML += '🤎';
                    }
                    if (trackerData[dateKey].note && trackerData[dateKey].note.trim() !== "") {
                        emojiContainer.innerHTML += '📝';
                    }
                }

                dayDiv.appendChild(emojiContainer);
                dayDiv.addEventListener('click', () => handleDayClick(dateKey, i, month, year));
                calendarDays.appendChild(dayDiv);
            }
            
            updateVirtualPet();
        }

        function updateVirtualPet() {
            const today = new Date();
            const todayKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            
            if (trackerData[todayKey] && trackerData[todayKey].isPeriod) {
                virtualPet.innerHTML = '🐻♨️';
            } else {
                virtualPet.innerHTML = '🐻✨';
            }
        }

        function throwConfetti() {
            const emojis = ['🩸', '🤎', '🍫', '✨'];
            for (let i = 0; i < 40; i++) {
                const conf = document.createElement('div');
                conf.classList.add('confetti-piece');
                conf.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = '-50px';
                conf.style.fontSize = (Math.random() * 15 + 15) + 'px';
                
                document.body.appendChild(conf);
                void conf.offsetWidth; 

                setTimeout(() => {
                    conf.style.top = '110vh';
                    conf.style.opacity = '0';
                }, 50 + Math.random() * 50); 

                setTimeout(() => {
                    conf.remove();
                }, 2500);
            }
        }

        function handleDayClick(dateKey, day, month, year) {
            if (multiSelectMode.checked) {
                if (!startDateKey) {
                    startDateKey = dateKey;
                    actionHint.style.display = 'block';
                } else {
                    applyMultiSelectPeriod(startDateKey, dateKey);
                    startDateKey = null;
                    multiSelectMode.checked = false;
                    actionHint.style.display = 'none';
                    renderCalendar();
                }
            } else {
                openModal(dateKey, day, month, year);
            }
        }

        async function applyMultiSelectPeriod(startStr, endStr) {
            let start = new Date(startStr);
            let end = new Date(endStr);

            if (start > end) {
                let temp = start; start = end; end = temp;
            }

            let curr = new Date(start);
            while (curr <= end) {
                let y = curr.getFullYear();
                let m = String(curr.getMonth() + 1).padStart(2, '0');
                let d = String(curr.getDate()).padStart(2, '0');
                let key = `${y}-${m}-${d}`;

                if (!trackerData[key]) trackerData[key] = { isPeriod: false, isSex: false, note: "", flow: "Medium" };
                trackerData[key].isPeriod = true;
                if(!trackerData[key].flow) trackerData[key].flow = "Medium"; 

                curr.setDate(curr.getDate() + 1);
            }
            
            // Save to Cloud
            await saveDataToCloud();
            renderCalendar();
            throwConfetti();
        }

        function openModal(dateKey, day, month, year) {
            selectedDateStr = dateKey;
            modalDateTitle.textContent = `Date: ${englishMonths[month]} ${day}, ${year}`;
            
            if (trackerData[dateKey]) {
                isPeriodCheckbox.checked = trackerData[dateKey].isPeriod || false;
                isSexCheckbox.checked = trackerData[dateKey].isSex || false;
                noteText.value = trackerData[dateKey].note || "";
                
                if (trackerData[dateKey].isPeriod && trackerData[dateKey].flow) {
                    Array.from(flowRadios).forEach(radio => {
                        radio.checked = (radio.value === trackerData[dateKey].flow);
                    });
                } else {
                    document.querySelector('input[name="flowLevel"][value="Medium"]').checked = true;
                }
            } else {
                isPeriodCheckbox.checked = false;
                isSexCheckbox.checked = false;
                noteText.value = "";
                document.querySelector('input[name="flowLevel"][value="Medium"]').checked = true;
            }
            
            flowOptionsDiv.style.display = isPeriodCheckbox.checked ? 'flex' : 'none';
            noteModal.style.display = 'flex';
        }

        function closeModal() {
            noteModal.style.display = 'none';
        }

        async function saveData() {
            if (!trackerData[selectedDateStr]) {
                trackerData[selectedDateStr] = {};
            }
            
            trackerData[selectedDateStr].isPeriod = isPeriodCheckbox.checked;
            trackerData[selectedDateStr].isSex = isSexCheckbox.checked;
            trackerData[selectedDateStr].note = noteText.value;
            
            if (isPeriodCheckbox.checked) {
                const selectedFlow = document.querySelector('input[name="flowLevel"]:checked').value;
                trackerData[selectedDateStr].flow = selectedFlow;
                throwConfetti(); 
            } else {
                delete trackerData[selectedDateStr].flow;
            }
            
            if (!trackerData[selectedDateStr].isPeriod && !trackerData[selectedDateStr].isSex && trackerData[selectedDateStr].note.trim() === "") {
                delete trackerData[selectedDateStr];
            }
            
            closeModal();
            // Save to Cloud and re-render
            await saveDataToCloud();
            renderCalendar();
        }

        multiSelectMode.addEventListener('change', () => {
            startDateKey = null;
            actionHint.style.display = 'none';
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        document.getElementById('cancelBtn').addEventListener('click', closeModal);
        document.getElementById('saveBtn').addEventListener('click', saveData);
        
        window.addEventListener('click', (e) => {
            if (e.target === noteModal) closeModal();
        });

        // Initialize app by fetching data from Cloud first
        loadDataFromCloud();

    </script>
</body>
</html>
